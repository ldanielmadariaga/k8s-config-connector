# Judgement queue for this service, written by controllerbuilder generate-types.
#
# Each entry is a call the generator could not make with confidence. Review it,
# then set status: resolved and a resolution:
#   accepted        the generated output is right as it is
#   edited          you changed the type; the note says how
#   deferred        right, but handled elsewhere; the note says where
#   not-applicable  wrong for this resource; the note says why
#
# Do not delete entries. The file is also the record of what was decided, and
# regenerating keeps the status of every entry it already has.
#
# While a possible-reference entry is open, TestMissingRefs does not fail on
# that field. Once it is resolved, the field is checked like any other. A field
# can have several of these entries, one per signal. Give them all the same
# status, or tests/apichecks fails.
#
# Until a Kind's untriaged-bulk-generation entry is resolved, every run checks
# the Kind again and adds new findings here. The Kind's <kind>_types.go is
# never rewritten, so after a generator change a finding can name a field that
# file does not have.

entries:
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: untriaged-bulk-generation
    detail: spec was generated from proto definition; verify refs, omissions, and KRM conventions
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: identity-not-in-cai
    detail: template "//health.googleapis.com/users/{user}/dataTypes/{data_type}/dataPoints/{data_point}" is not listed in docs/ai/metadata/cloudassetinventory_names.jsonl; verify the URL format or add an exception in pkg/gcpurls/registry_test.go
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: identity-root-unknown
    detail: pattern "users/{user}/dataTypes/{data_type}/dataPoints/{data_point}" contains ancestor segment(s) users/{user}, dataTypes/{data_type} with no matching reference or field on HealthDataPointSpec
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: identity-server-generated-id
    detail: generated HealthDataPointIdentity implements identity.ServerGeneratedIdentity because the Create RPC has no *_id parameter; confirm whether the resource ID is truly server-generated or client-specified in .name
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: parent-ref-not-modelled
    detail: the parent is users/{user}/dataTypes/{data_type}, and no DataTypeRef type exists to point at; add the parent resource first, then model this as a reference
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: root-ref-not-modelled
    detail: the root is users/{user}, and no UserRef type exists to point at; add the root resource first, then model this as a reference
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    reason: verify-resource-docs-link
    detail: 'none of these loaded as a page ending in /v4/users.dataTypes.dataPoints: https://docs.cloud.google.com/health/docs/reference/rest/v4/users.dataTypes.dataPoints'
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    field: .spec.food.defaultServing.foodMeasurementUnit
    reason: possible-reference
    detail: the proto marks this field as a reference to health.googleapis.com/DataPoint (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    field: .spec.food.servings[].foodMeasurementUnit
    reason: possible-reference
    detail: the proto marks this field as a reference to health.googleapis.com/DataPoint (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    field: .spec.nutritionLog.food
    reason: possible-reference
    detail: the proto marks this field as a reference to health.googleapis.com/DataPoint (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    field: .spec.nutritionLog.food
    reason: possible-reference-by-description-loose
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    field: .spec.nutritionLog.serving.foodMeasurementUnit
    reason: possible-reference
    detail: the proto marks this field as a reference to health.googleapis.com/DataPoint (google.api.resource_reference); confirm whether it should be a KCC reference
    status: open
  - kind: HealthDataPoint
    group: health.cnrm.cloud.google.com
    field: .spec.sleep.metadata.externalID
    reason: possible-reference-by-name
    detail: the field name ends in ID/IDs; confirm whether it references another resource
    status: open
