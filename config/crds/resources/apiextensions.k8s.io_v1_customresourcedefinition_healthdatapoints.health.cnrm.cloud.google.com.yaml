                      metadata:
                        description: 'Optional. Sleep metadata: `processed`, `main_sleep`,
                          `manually_edited`, and `stages_status`.'
                        properties:
                          mainSleep:
                            description: 'Output only. `main_sleep`: the longest sleep
                              session with stages within one day. If no sleep session
                              has stages, then the longest sleep is the `main_sleep`.  If
                              there are multiple days of sleep in the response, there
                              is one `main_sleep` per day.'
                            type: boolean
                          manuallyEdited:
                            description: Output only. Some sleeps autodetected by
                              algorithms can be manually edited by users.
                            type: boolean
                          nap:
                            description: Output only. Naps are sleeps without stages
                              and relatively short durations.
                            type: boolean
                          processed:
                            description: Output only. Sleep and sleep stages algorithms
                              finished processing. A `true` value indicates whether
                              all data processing for the session is complete. A `false`
                              value means sleep period is detected but sleep stages
                              is still processing.
                            type: boolean
                          stagesStatus:
                            description: Output only. Sleep stages algorithm processing
                              status.
                            type: string
                        type: object
