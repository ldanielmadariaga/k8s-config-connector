                                time at the start of the sleep stage relative to the
                                Coordinated Universal Time (UTC).
                              type: string
                            type:
                              description: 'Required. Sleep stage type: AWAKE, DEEP,
                                REM, LIGHT etc.'
                              type: string
                            updateTime:
                              description: Output only. Last update time of this sleep
                                stages segment.
                              type: string
                          type: object
