                            description: Output only. Total number of minutes asleep.
                              For classic sleep it is the sum of ASLEEP stages (excluding
                              AWAKE and RESTLESS). For "stages" sleep it is the sum
                              of LIGHT, REM and DEEP stages (excluding AWAKE).
                            format: int64
                            type: integer
